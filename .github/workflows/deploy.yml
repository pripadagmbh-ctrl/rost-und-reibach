name: Deploy zu GitHub Pages

# Baut den Prototyp (unverändert auf die Root-URL), v1 (Unterpfad /v1/) und
# Bagerana v2 (Unterpfad /v2/).
# Prototyp-URL bleibt: https://<user>.github.io/rost-und-reibach/
# v1-URL:              https://<user>.github.io/rost-und-reibach/v1/
# v2-URL:              https://<user>.github.io/rost-und-reibach/v2/
#
# Alle drei bauen mit `base: "./"`, also relativen Pfaden — deshalb braucht
# keiner von ihnen seinen Unterpfad zu kennen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prototyp — Abhängigkeiten
        working-directory: prototype
        run: npm ci
      - name: Prototyp — Bauen
        working-directory: prototype
        run: npm run build

      - name: v1 — Abhängigkeiten
        working-directory: v1
        run: npm ci
      - name: v1 — Bauen
        working-directory: v1
        run: npm run build
      # Die Zeichnungen gehoeren mit auf den Server. Patrick schaut nur auf
      # iPhone und iPad; was hier nicht liegt, kann er nicht ansehen
      # (Befund 15.09.2026: 404 auf Baggerkonzept und Platzkonzept).
      - name: v1 — Planmappe erzeugen
        working-directory: v1
        run: node tools/planmappe.mjs

      - name: v2 — Abhängigkeiten
        working-directory: v2/web
        run: npm ci
      - name: v2 — Prüfen (check, lint, test)
        working-directory: v2/web
        run: npm run verify
      - name: v2 — Bauen
        working-directory: v2/web
        run: npm run build

      - name: Zusammenführen (Prototyp = Root, v1 = /v1/, v2 = /v2/)
        run: |
          mkdir -p site
          cp -r prototype/dist/. site/
          mkdir -p site/v1
          cp -r v1/dist/. site/v1/
          mkdir -p site/v1/plaene
          cp -r v1/docs/. site/v1/plaene/
          mkdir -p site/v2
          cp -r v2/web/dist/. site/v2/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
